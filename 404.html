<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Jatin Mishra Portfolio</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/jpeg" href="images/jatinmishra-nav.jpg">

  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #181818;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background: rgba(24, 24, 24, 0.98);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    .navbar a { color: #fff; text-decoration: none; margin: 0 1rem; font-weight: 600; transition: .2s; }
    .navbar a:hover { color: #ffbd39; }
    .nav-brand { display: flex; align-items: center; gap: 0.8rem; }
    .nav-profile-wrap { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; border: 2px solid #ffbd39; flex-shrink: 0; display: block; }
    .nav-profile-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .navbar .brand { font-size: 1.5rem; color: #ffbd39; font-weight: 700; }

    .error-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }
    .error-code {
      font-size: 7rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(45deg, #ffbd39, #ff6b35);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .error-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.8rem;
    }
    .error-message {
      color: #ccc;
      font-size: 1.05rem;
      max-width: 460px;
      line-height: 1.6;
      margin-bottom: 2.2rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .error-btn {
      display: inline-block;
      text-decoration: none;
      padding: 0.8rem 2rem;
      border-radius: 25px;
      font-weight: 700;
      font-size: 1rem;
      transition: .2s;
    }
    .error-btn.primary {
      background: linear-gradient(45deg, #ffbd39, #ff6b35);
      color: #181818;
    }
    .error-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,189,57,0.3); }
    .error-btn.secondary {
      background: transparent;
      color: #ffbd39;
      border: 2px solid #ffbd39;
    }
    .error-btn.secondary:hover { background: #ffbd39; color: #181818; }

    .error-links {
      margin-top: 2.5rem;
      color: #888;
      font-size: 0.9rem;
    }
    .error-links a { color: #ffbd39; text-decoration: none; margin: 0 0.5rem; }
    .error-links a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      .error-code { font-size: 5rem; }
      .error-title { font-size: 1.4rem; }
      .navbar { padding: 0.7rem 1rem; }
      .navbar .brand { font-size: 1.1rem; }
      .error-actions { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <span class="nav-profile-wrap"><img src="images/jatinmishra-nav.jpg" alt="Jatin Mishra" class="nav-profile-img" /></span>
      <span class="brand">Jatin Mishra</span>
    </div>
    <div>
      <a href="./">Home</a>
    </div>
  </nav>

  <div class="error-container">
    <div class="error-code">404</div>
    <div class="error-title">Oops! This page wandered off.</div>
    <p class="error-message">
      The page you're looking for doesn't exist or may have moved.
      Let's get you back on track.
    </p>
    <div class="error-actions">
      <a href="./" class="error-btn primary">🏠 Back to Home</a>
      <a href="projects/" class="error-btn secondary">🚀 View Projects</a>
    </div>
    <div class="error-links">
      <a href="about/">About</a> ·
      <a href="experience/">Experience</a> ·
      <a href="contact/">Contact</a>
    </div>
  </div>
</body>
</html>
